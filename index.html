<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SSPathshala | মডুলার লার্নিং প্ল্যাটফর্ম</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Anek Bangla', sans-serif;
            background: #f0f7fc;
            color: #0a2b3e;
            scroll-behavior: smooth;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
        }
        /* হেডার */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 2px solid #e0edf3;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .brand-area {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }
        .site-title h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #0f4c5f, #1f8a9e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .tagline {
            font-size: 0.75rem;
            color: #2c6e8a;
            background: #e3f0f5;
            padding: 3px 12px;
            border-radius: 40px;
            font-weight: 500;
        }
        .telegram-btn {
            background: linear-gradient(135deg, #0088cc, #006699);
            padding: 8px 22px;
            border-radius: 40px;
            transition: 0.25s;
            box-shadow: 0 2px 8px rgba(0,136,204,0.2);
        }
        .telegram-btn a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .telegram-btn:hover {
            transform: translateY(-2px);
        }
        /* ছোট ট্যাব বাটন - এক লাইনে, কমপ্যাক্ট */
        .tab-buttons {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            gap: 12px;
            margin: 20px 0 32px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: thin;
        }
        .tab-btn {
            background: white;
            border: 1px solid #cbdde9;
            font-weight: 600;
            font-size: 0.8rem;
            padding: 7px 18px;
            border-radius: 40px;
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #1e5a7a;
            transition: all 0.2s;
        }
        .tab-btn i {
            font-size: 0.8rem;
        }
        .tab-btn.active {
            background: #1f6e8c;
            color: white;
            border-color: #1f6e8c;
            box-shadow: 0 2px 8px rgba(31,110,140,0.2);
        }
        .tab-btn:hover:not(.active) {
            background: #eef3fc;
            border-color: #1f6e8c;
        }
        /* স্লাইডার */
        .fb-cover-slider {
            margin: 5px 0 40px;
            border-radius: 28px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s ease;
        }
        .slide.active { opacity: 1; z-index: 1; }
        /* ট্যাব কন্টেন্ট */
        .tab-content-area {
            background: white;
            border-radius: 32px;
            padding: 28px 24px;
            margin-bottom: 50px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.05);
        }
        .tab-pane { display: none; animation: fadeIn 0.3s ease; }
        .tab-pane.active-pane { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }
        /* কার্ড গ্রিড */
        .card-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            margin-top: 25px;
        }
        .course-card, .ebook-card, .success-card, .review-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            flex: 1 1 270px;
            transition: 0.25s;
            box-shadow: 0 8px 18px rgba(0,0,0,0.06);
            border: 1px solid #eaf3fa;
        }
        .course-card:hover, .ebook-card:hover { transform: translateY(-5px); box-shadow: 0 15px 28px rgba(0,0,0,0.1); }
        .course-img, .student-img {
            width: 100%;
            height: 170px;
            object-fit: cover;
        }
        .course-info, .card-info {
            padding: 18px 16px 22px;
        }
        .course-info h3 {
            font-size: 1.2rem;
            font-weight: 800;
        }
        .course-price {
            font-weight: 800;
            color: #e67e22;
            font-size: 1.2rem;
            margin: 8px 0;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .btn-enroll, .btn-details {
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.75rem;
            border: none;
            cursor: pointer;
        }
        .btn-enroll { background: #1f6e8c; color: white; }
        .btn-details { background: #f0f4fa; color: #1f6e8c; border: 1px solid #cbdde9; }
        .search-ebook {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .search-ebook input {
            flex: 1;
            padding: 10px 20px;
            border-radius: 60px;
            border: 1px solid #cbdde9;
            font-size: 0.9rem;
        }
        .search-ebook button {
            background: #1f6e8c;
            border: none;
            padding: 10px 26px;
            border-radius: 60px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .whatsapp-buy {
            background: #25D366;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        /* ডিটেইল পেজ */
        .detail-page-container {
            max-width: 1100px;
            margin: 20px auto;
            background: white;
            border-radius: 32px;
            overflow: hidden;
            display: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
        }
        .detail-page-container.active-detail { display: block; }
        .detail-cover {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }
        .detail-content { padding: 32px 36px; }
        .detail-title {
            font-size: 1.9rem;
            font-weight: 800;
            border-left: 5px solid #1f6e8c;
            padding-left: 20px;
            margin-bottom: 24px;
        }
        .detail-features {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px,1fr));
            gap: 16px;
            background: #f8fafd;
            padding: 20px;
            border-radius: 24px;
            margin: 24px 0;
        }
        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
        }
        .back-button {
            background: #eef2fa;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 24px;
            font-size: 0.85rem;
        }
        .whatsapp-btn-large {
            background: #25D366;
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }
        /* উন্নত ফুটার */
        .footer {
            background: #0a2b38;
            color: #e0f0f5;
            border-radius: 32px 32px 0 0;
            margin-top: 60px;
            padding: 45px 24px 30px;
        }
        .footer-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 35px;
            max-width: 1300px;
            margin: 0 auto 35px;
        }
        .footer-col {
            flex: 1 1 210px;
        }
        .footer-col h4 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 18px;
            color: #ffdc97;
            position: relative;
            display: inline-block;
        }
        .footer-col h4:after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 40px;
            height: 2px;
            background: #ffb347;
            border-radius: 2px;
        }
        .footer-col p, .footer-col a {
            color: #c7e2ed;
            font-size: 0.85rem;
            line-height: 1.7;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            transition: 0.2s;
        }
        .footer-col a:hover {
            color: white;
            transform: translateX(4px);
        }
        .social-icons {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        .social-icons a {
            background: #1f5065;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.25s;
        }
        .social-icons a i {
            font-size: 1.1rem;
        }
        .social-icons a:hover {
            background: #ffb347;
            transform: translateY(-3px);
        }
        .newsletter-box {
            display: flex;
            gap: 8px;
            background: #1f5065;
            border-radius: 50px;
            padding: 4px;
            margin-top: 10px;
        }
        .newsletter-box input {
            background: none;
            border: none;
            padding: 10px 14px;
            color: white;
            outline: none;
            flex: 1;
            font-family: inherit;
            font-size: 0.8rem;
        }
        .newsletter-box input::placeholder {
            color: #b0d4e8;
        }
        .newsletter-box button {
            background: #ffb347;
            border: none;
            border-radius: 50px;
            padding: 8px 18px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .footer-bottom {
            text-align: center;
            border-top: 1px solid #2b576b;
            padding-top: 25px;
            margin-top: 10px;
            font-size: 0.75rem;
        }
        @media (max-width: 750px) {
            .tab-btn { padding: 5px 14px; font-size: 0.7rem; }
            .detail-content { padding: 22px; }
            .detail-title { font-size: 1.5rem; }
            .footer-grid { flex-direction: column; text-align: center; align-items: center; }
            .social-icons { justify-content: center; }
            .footer-col h4:after { left: 50%; transform: translateX(-50%); }
        }
        .loading { text-align: center; padding: 40px; font-size: 1rem; color: #1f6e8c; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand-area">
            <div class="site-title"><h1>SSPathshala</h1></div>
    
        </div>

    <!-- স্লাইডার -->
    <div class="fb-cover-slider">

        <button class="tab-btn" data-tab="successTab"><i class="fas fa-trophy"></i> সাফল্য</button>

        <div id="ebooksTab" class="tab-pane"><div class="loading"><i class="fas fa-spinner fa-pulse"></i> ই-বুক লোড হচ্ছে...</div></div>

        <div id="reviewTab" class="tab-pane"><div class="loading"><i class="fas fa-spinner fa-pulse"></i> রিভিউ সংগ্রহ করা হচ্ছে...</div></div>

</div>

<!-- ডিটেইল পেজ -->
<div id="detailPage" class="detail-page-container">
    <div class="detail-header"><img id="detailCover" class="detail-cover"></div>
    <div class="detail-content">

        <a id="detailWhatsappLink" href="#" target="_blank" class="whatsapp-btn-large"><i class="fab fa-whatsapp"></i> হোয়াটসঅ্যাপে ভর্তি হতে চাই</a>
    </div>
</div>

<!-- উন্নত ফুটার -->
<div class="footer">
    <div class="container">
        <div class="footer-grid">
            <div class="footer-col">
            <div class="footer-col">
                <h4>কমিউনিটি</h4>
                <div class="social-icons">
                    <a href="https://www.facebook.com/share/g/19zJUTkW3f/" target="_blank"><i class="fab fa-facebook-f"></i></a>
                    <a href="https://t.me/sspathshala" target="_blank"><i class="fab fa-telegram-plane"></i></a>
                                      <a href="https://youtube.com/@ss_pathshala008?si=RqTpUi3QaHyZ-Z8f" target="_blank"><i class="fab fa-youtube"></i></a>
                </div>
                           </div>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p><i class="far fa-copyright"></i> ২০২৬ SSPathshala — জ্ঞান ও সাফল্যের পথে | সর্বস্বত্ব সংরক্ষিত</p>
            <p style="margin-top: 8px; font-size:0.7rem;">পাওয়ার্ড বাই মডুলার JSON আর্কিটেকচার | ডিজাইন & ডেভেলপমেন্ট: SSPathshala টিম</p>

<script>
    let coursesData = [], ebooksData = [], successData = [], reviewsData = [];

    async function loadJSON(url) {
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        } catch (err) {
            console.error(`Error loading ${url}:`, err);
            return [];
        }
    }

    async function loadAllData() {
        [coursesData, ebooksData, successData, reviewsData] = await Promise.all([
            loadJSON('courses.json'),
            loadJSON('ebooks.json'),
            loadJSON('success.json'),
            loadJSON('reviews.json')
        ]);
        renderCourses();
        renderEbooks();
        renderSuccess();
        renderReviews();
    }

    function renderCourses() {
        const container = document.getElementById('coursesTab');
        if (!coursesData.length) { container.innerHTML = '<p class="loading">কোর্স ডেটা পাওয়া যায়নি</p>'; return; }
        container.innerHTML = `<h2><i class="fas fa-chalkboard-user"></i> প্রফেশনাল কোর্স</h2><div class="card-grid" id="coursesContainer"></div>`;
        const grid = document.getElementById('coursesContainer');
        grid.innerHTML = coursesData.map(c => `
            <div class="course-card">
                <img class="course-img" src="${c.img}" alt="${c.title}">
                <div class="course-info">
                    <h3>${c.title}</h3>
                    <div class="course-price">${c.price} <span style="font-size:0.8rem; text-decoration:line-through;">${c.originalPrice || ''}</span></div>
                    <div class="button-group">
                        <button class="btn-enroll" data-id="${c.id}"><i class="fas fa-check-circle"></i> এনরোল</button>
                        <button class="btn-details" data-id="${c.id}"><i class="fas fa-info-circle"></i> বিস্তারিত</button>
                    </div>
                </div>
            </div>
        `).join('');
        attachCourseEvents();
    }

    function attachCourseEvents() {
        document.querySelectorAll('#coursesContainer .btn-enroll').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = parseInt(btn.dataset.id);
                const course = coursesData.find(c => c.id === id);
                window.open(`https://wa.me/8801700000000?text=${encodeURIComponent(`হ্যালো, আমি "${course.title}" কোর্সে এনরোল করতে আগ্রহী।`)}`, '_blank');
            });
        });
        document.querySelectorAll('#coursesContainer .btn-details').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = parseInt(btn.dataset.id);
                const course = coursesData.find(c => c.id === id);
                showDetailPage(course);
            });
        });
    }

    function showDetailPage(course) {
        document.querySelector('.tab-content-area').style.display = 'none';
        document.querySelector('.fb-cover-slider').style.display = 'none';
        document.querySelector('.tab-buttons').style.display = 'none';
        document.getElementById('detailPage').classList.add('active-detail');
        document.getElementById('detailCover').src = course.img;
        document.getElementById('detailTitle').innerText = course.title;
        document.getElementById('detailFeatures').innerHTML = course.features.map(f => `<div class="feature-item"><i class="fas fa-check-circle"></i> ${f}</div>`).join('');
        document.getElementById('detailMentor').innerHTML = `<i class="fas fa-user-tie"></i> <strong>মেন্টর:</strong> ${course.mentor || 'আমাদের এক্সপার্ট টিম'}`;
        document.getElementById('detailConduct').innerHTML = `<i class="fas fa-chalkboard-teacher"></i> <strong>কিভাবে পরিচালনা হবে:</strong><br> ${course.conduction || 'লাইভ ক্লাস, রেকর্ডেড ভিডিও ও সাপোর্ট'}`;
        document.getElementById('detailExtra').innerHTML = `<i class="fas fa-gift"></i> <strong>অতিরিক্ত সুবিধা:</strong><br> ${course.extra || 'ক্যারিয়ার গাইডলাইন ও সার্টিফিকেট'}`;
        document.getElementById('detailPrice').innerHTML = `মূল্য: ${course.price} ${course.originalPrice ? `<span style="font-size:1rem; text-decoration:line-through; margin-left:10px;">${course.originalPrice}</span>` : ''}`;
        const waMsg = encodeURIComponent(`আমি "${course.title}" কোর্সের বিস্তারিত দেখে ভর্তি হতে চাই।`);
        document.getElementById('detailWhatsappLink').href = `https://wa.me/8801700000000?text=${waMsg}`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function hideDetailAndShowMain() {
        document.getElementById('detailPage').classList.remove('active-detail');
        document.querySelector('.tab-content-area').style.display = 'block';
        document.querySelector('.fb-cover-slider').style.display = 'block';
        document.querySelector('.tab-buttons').style.display = 'flex';
    }

    function renderEbooks(filter = '') {
        const container = document.getElementById('ebooksTab');
        const filtered = ebooksData.filter(b => b.title.toLowerCase().includes(filter.toLowerCase()));
        container.innerHTML = `
            <h2><i class="fas fa-download"></i> ডিজিটাল ই-বুক কালেকশন</h2>
            <div class="search-ebook">
                <input type="text" id="ebookSearch" placeholder="🔍 ই-বুক সার্চ করুন...">
                <button id="searchEbookBtn"><i class="fas fa-search"></i> খুঁজুন</button>
            </div>
            <div class="card-grid" id="ebooksContainer"></div>
        `;
        const grid = document.getElementById('ebooksContainer');
        if (!filtered.length) { grid.innerHTML = '<p style="text-align:center;">🔍 কোনো ই-বুক খুঁজে পাওয়া যায়নি</p>'; return; }
        grid.innerHTML = filtered.map(book => `
            <div class="ebook-card">
                <img class="student-img" src="${book.img}">
                <div class="card-info">
                    <span style="background:#e0f2fe; padding:4px 12px; border-radius:40px; font-size:0.7rem; font-weight:600;">${book.type === 'free' ? '📘 ফ্রি' : '💎 প্রিমিয়াম'}</span>
                    <h3>${book.title}</h3>
                    <p>${book.desc}</p>
                    ${book.type === 'free' ? `<button class="download-free" style="background:#eef2fa; border:none; padding:7px 18px; border-radius:40px; margin-top:10px; font-weight:600;">ডাউনলোড লিংক</button>` : `<button class="whatsapp-buy buy-paid" data-title="${book.title}" data-price="${book.price}"><i class="fab fa-whatsapp"></i> কিনুন</button>`}
                </div>
            </div>
        `).join('');
        document.querySelectorAll('.download-free').forEach(btn => btn.addEventListener('click', () => toastMsg("📖 ফ্রি ই-বুক লিংক পেতে টেলিগ্রাম চ্যানেল জয়েন করুন।")));
        document.querySelectorAll('.buy-paid').forEach(btn => btn.addEventListener('click', () => { const title = btn.dataset.title; const price = btn.dataset.price; window.open(`https://wa.me/8801700000000?text=${encodeURIComponent(`আমি "${title}" ই-বুকটি কিনতে চাই, মূল্য: ${price}।`)}`, '_blank'); }));
        document.getElementById('ebookSearch')?.addEventListener('keyup', (e) => { if(e.key === 'Enter') renderEbooks(e.target.value); });
        document.getElementById('searchEbookBtn')?.addEventListener('click', () => renderEbooks(document.getElementById('ebookSearch').value));
    }

    function renderSuccess() {
        const container = document.getElementById('successTab');
        container.innerHTML = `<h2><i class="fas fa-medal"></i> সাফল্য — চান্সপ্রাপ্ত শিক্ষার্থী</h2><div class="card-grid" id="successContainer"></div>`;
        const grid = document.getElementById('successContainer');
        grid.innerHTML = successData.map(s => `<div class="success-card"><img class="student-img" src="${s.img}"><div class="card-info"><h3>${s.name}</h3><p><i class="fas fa-trophy" style="color:#f5b342;"></i> <strong>${s.achievement}</strong></p><p>${s.description}</p></div></div>`).join('');
    }

    function renderReviews() {
        const container = document.getElementById('reviewTab');
        container.innerHTML = `<h2><i class="fas fa-comment-dots"></i> রিভিউ — সাফল্যের অনুপ্রেরণা</h2><div class="card-grid" id="reviewContainer"></div>`;
        const grid = document.getElementById('reviewContainer');
        grid.innerHTML = reviewsData.map(r => `<div class="review-card"><img class="student-img" src="${r.img}"><div class="card-info"><h3>${r.name}</h3><p><i class="fas fa-quote-left" style="color:#1f6e8c;"></i> ${r.story}</p></div></div>`).join('');
    }

    function toastMsg(msg) {
        let t = document.createElement('div');
        t.innerText = msg;
        t.style.position = 'fixed';
        t.style.bottom = '20px';
        t.style.left = '50%';
        t.style.transform = 'translateX(-50%)';
        t.style.backgroundColor = '#0a2b38';
        t.style.color = 'white';
        t.style.padding = '10px 24px';
        t.style.borderRadius = '50px';
        t.style.zIndex = '9999';
        t.style.fontWeight = '500';
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2500);
    }

    // ট্যাব অ্যাক্টিভেশন
    const tabs = document.querySelectorAll('.tab-btn');
    const panes = document.querySelectorAll('.tab-pane');
    function activateTab(tabId) {
        panes.forEach(p => p.classList.remove('active-pane'));
        document.getElementById(tabId).classList.add('active-pane');
        tabs.forEach(btn => { if(btn.dataset.tab === tabId) btn.classList.add('active'); else btn.classList.remove('active'); });
    }
    tabs.forEach(btn => btn.addEventListener('click', () => { if(document.getElementById('detailPage').classList.contains('active-detail')) return; activateTab(btn.dataset.tab); }));

    // স্লাইডার
    let slides = document.querySelectorAll('.slide'), currentSlide = 0;
    function showSlide(i) { slides.forEach((s, idx) => s.classList.toggle('active', idx === i)); }
    function nextSlide() { currentSlide = (currentSlide + 1) % slides.length; showSlide(currentSlide); }
    let interval = setInterval(nextSlide, 4500);
    const sliderDiv = document.querySelector('.fb-cover-slider');
    if(sliderDiv) { sliderDiv.addEventListener('mouseenter', () => clearInterval(interval)); sliderDiv.addEventListener('mouseleave', () => { interval = setInterval(nextSlide, 4500); }); }

    document.getElementById('backToHomeBtn').addEventListener('click', hideDetailAndShowMain);
    loadAllData();
</script>
</body>
</html>
